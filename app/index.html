<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5B6AF5">
  <meta name="description" content="맑은소프트 공통 프로젝트 메모리 MCP + 대시보드. 프로젝트별 작업이력·결정·이슈·상태를 조회합니다.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="malgnai-hub">
  <link rel="manifest" href="/manifest.json">
  <title>malgnai-hub · 프로젝트 메모리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/base.css" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
  <!-- 마크다운 파서+살균기. 카탈로그 상세(content_md)뿐 아니라 프로젝트 상세(state 자유서술 텍스트)
       등 utils.js renderMarkdown()으로 v-html 렌더링하는 화면 전반에서 공용으로 쓴다. 신뢰 소스
       (회사 GitHub 플러그인 repo / MCP work_record)이지만 v-html로 주입하므로 DOMPurify로 한 번 거른다. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="/assets/js/vue-zero.js"></script>
  <script src="/assets/js/utils.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    (async () => {
      // vue-zero 라우터 auth guard는 localStorage.token의 JWT exp만 동기 검사해
      // 만료 시 즉시 /login으로 리다이렉트한다(vendored 라이브러리라 수정 불가).
      // guard가 돌기 전에, access token이 만료됐지만 refresh_token이 있으면
      // 여기서 미리 갱신해 불필요한 재로그인을 막는다.
      const token = localStorage.getItem('token')
      let expired = true
      if (token) {
        try {
          const payload = decodeJwtPayload(token)
          expired = !payload || !payload.exp || payload.exp * 1000 <= Date.now()
        } catch {
          expired = true
        }
      }
      if (expired && localStorage.getItem('refresh_token')) {
        await refreshAccessToken()
      }
      VueZero.createApp({
        auth: { enabled: true, loginPage: '/login', tokenKey: 'token' }
      })
    })()
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
